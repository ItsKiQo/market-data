name: Download futures candles

on:
  schedule:
    - cron: "30 0 * * 2-6"   # 01:30 CET, Tue-Sat (yesterday's full session)
    - cron: "0 2 * * 2-6"    # 03:00 CET, backup run
    - cron: "0 14 * * 1-5"   # 15:00 CET, before the afternoon brief
  workflow_dispatch:         # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python download.py
      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
